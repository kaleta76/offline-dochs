name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint celého projektu (len informatívne)
        run: bun run lint
        continue-on-error: true   # existujúci kód v src/ nie je prettier-čistý (vyše 1 200 formátovacích chýb); blokujúce je len contract/
      - name: Lint kontraktu a súborov registrácie (blokujúce)
        run: >
          bunx eslint contract
          src/lib/accounts-core.ts src/lib/accounts-core.test.ts src/lib/accounts.functions.ts
          src/lib/credentials.ts src/lib/credentials.test.ts
          src/lib/onboarding-logic.ts src/lib/onboarding-logic.test.ts
          src/lib/onboarding-rules.ts src/lib/onboarding-rules.test.ts
          src/lib/registration-code.ts src/components/EmployeeAccess.tsx src/routes/auth.tsx
      - name: Typová kontrola (blokujúca len pre súbory registrácie)
        run: |
          bunx tsc --noEmit -p tsconfig.json > tsc.log 2>&1 || true
          echo "Počet typových chýb v celom projekte (informatívne): $(grep -c 'error TS' tsc.log || true)"
          if grep -E '^src/(lib/(accounts-core|accounts\.functions|credentials|onboarding-logic|onboarding-rules|registration-code)|components/EmployeeAccess|routes/auth)' tsc.log; then
            echo "Typové chyby v súboroch registrácie"; exit 1
          fi
      - run: bun run test          # vrátane contract/tests (pozri vitest.config.ts)
      - run: bun run build
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Overenie zlatého súboru exportu
        run: python3 -I contract/tools/verify_export.py contract/examples/punches_example.csv
      - name: Testy overovača exportu
        run: python3 -I contract/tools/test_verify_export.py
      - name: Kontrola balíka Access (kontrolné súčty modulov, verzie, zakázané súbory)
        run: python3 -I tools/over_access_balik.py
      - name: Testy kontroly balíka Access
        run: python3 -I tools/test_over_access_balik.py
      - name: Testy overenia zálohy databázy
        run: python3 -I tools/test_over_zalohu.py
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola súborov .env (smú obsahovať len verejné hodnoty)
        run: |
          python3 -I - <<'PY'
          import base64, json, re, subprocess, sys
          bad = False
          for f in subprocess.check_output(["git", "ls-files"], text=True).splitlines():
              if not re.search(r"(^|/)\.env(\.|$)", f) or f.endswith(".example"):
                  continue
              txt = open(f, encoding="utf-8").read()
              for m in re.finditer(r"eyJ[\w-]+\.([\w-]+)\.[\w-]+", txt):
                  pad = m.group(1) + "=" * (-len(m.group(1)) % 4)
                  role = json.loads(base64.urlsafe_b64decode(pad)).get("role")
                  if role != "anon":
                      print(f"CHYBA: {f} obsahuje JWT s rolou {role}"); bad = True
              for line in txt.splitlines():
                  key = line.split("=", 1)[0].strip()
                  if key and not key.startswith("#") and not re.fullmatch(r"(VITE_)?SUPABASE_(URL|PUBLISHABLE_KEY|PROJECT_ID)", key):
                      print(f"CHYBA: {f} obsahuje neočakávaný kľúč {key}"); bad = True
              print(f"POZNÁMKA: {f} je v gite (obsahuje len verejné hodnoty). Odporúča sa ho z gitu odstrániť, ale najprv overte, že to Lovable znesie.")
          sys.exit(1 if bad else 0)
          PY
      - name: Hľadanie tajných hodnôt v kóde
        run: |
          if git grep -nE 'service_role|BEGIN (RSA |EC )?PRIVATE KEY' -- . ':!drizzle' ':!contract' ':!docs' ':!prompts' ':!.github' ':!src/integrations' ':!.lovable' ':!tools/sql_test'; then echo "Podozrivá tajná hodnota"; exit 1; fi
      - name: Zálohy databázy nepatria do repozitára
        run: |
          if git ls-files | grep -E '(^|/)zalohy/|\.(dump|backup|pgdump)(\.(gz|zip))?$|\.sql\.gz$'; then echo "V repozitári je záloha databázy (obsahuje prihlasovacie účty a odtlačky hesiel)"; exit 1; fi
